<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="MovieApp - Stream and discover your favorite movies and TV series with high-quality playback.">
  <meta name="theme-color" content="#0F0F1A">

  <!-- Open Graph / Facebook / WhatsApp SEO -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="MovieApp - Unlimited Movies & Series">
  <meta property="og:description" content="Watch high quality movies, trending TV series, and anime seamless streaming.">
  <meta property="og:image" content="assets/images/hero.jpg">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="MovieApp - Stream Movies & Series">
  <meta name="twitter:description" content="Watch high quality movies and series seamless streaming.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MovieApp">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MovieApp - Stream Movies & Series</title>
  <link rel="manifest" href="manifest.json">

  <meta name="google-signin-client_id" content="888171081165-jtfv3p77esnh6333qn6sso21hj2si1cc.apps.googleusercontent.com">

  <style>
    body {
      background-color: #0F0F1A;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }
    .app-logo {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: linear-gradient(135deg, #6C5CE7 0%, #a29bfe 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(108, 92, 231, 0.4);
      animation: pulse 2s infinite ease-in-out;
    }
    .app-logo svg {
      width: 44px;
      height: 44px;
      fill: #FFFFFF;
    }
    .loading-bar {
      width: 140px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }
    .loading-bar-inner {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #6C5CE7, #FF7675);
      position: absolute;
      left: -100%;
      animation: loading 1.5s infinite ease-in-out;
    }
    .loading-text {
      color: #A0A0B0;
      font-size: 14px;
      letter-spacing: 0.5px;
      font-weight: 500;
    }
    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 10px 30px rgba(108, 92, 231, 0.4); }
      50% { transform: scale(1.06); box-shadow: 0 15px 40px rgba(108, 92, 231, 0.7); }
      100% { transform: scale(1); box-shadow: 0 10px 30px rgba(108, 92, 231, 0.4); }
    }
    @keyframes loading {
      0% { left: -100%; }
      50% { left: 0%; }
      100% { left: 100%; }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading-container">
    <div class="app-logo">
      <svg viewBox="0 0 24 24">
        <path d="M8 5v14l11-7z"/>
      </svg>
    </div>
    <div class="loading-bar">
      <div class="loading-bar-inner"></div>
    </div>
    <div class="loading-text">Loading MovieApp...</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
