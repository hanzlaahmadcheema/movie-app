name: Build Windows App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows zip
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate required configuration
        shell: pwsh
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TMDB_READ_ACCESS_TOKEN)) {
            Write-Error "Missing secret: TMDB_READ_ACCESS_TOKEN"
            exit 1
          }

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        shell: pwsh
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: |
          flutter build windows --release --dart-define=TMDB_READ_ACCESS_TOKEN="$env:TMDB_READ_ACCESS_TOKEN"

      - name: Package Windows app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\movie-app-windows.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: movie-app-windows
          path: dist/movie-app-windows.zip
