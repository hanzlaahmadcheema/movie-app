name: Build Linux App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Linux zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            libgtk-3-dev \
            ninja-build \
            pkg-config

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate required configuration
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: |
          if [ -z "$TMDB_READ_ACCESS_TOKEN" ]; then
            echo "Missing secret: TMDB_READ_ACCESS_TOKEN"
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux release
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: |
          flutter build linux --release \
            --dart-define=TMDB_READ_ACCESS_TOKEN="$TMDB_READ_ACCESS_TOKEN"

      - name: Package Linux app
        run: |
          mkdir -p dist
          (cd build/linux/x64/release/bundle && zip -r ../../../../../dist/movie-app-linux.zip .)

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: movie-app-linux
          path: dist/movie-app-linux.zip
