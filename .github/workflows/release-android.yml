name: Release All Platforms

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: movie-app

jobs:
  tag:
    name: Auto Generate Tag
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
      new_version: ${{ steps.tag_version.outputs.new_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

  android:
    name: Build Android APK
    needs: tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required configuration
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: |
          if [ -z "$TMDB_READ_ACCESS_TOKEN" ]; then
            echo "Missing secret: TMDB_READ_ACCESS_TOKEN"
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create dummy .env
        run: cp .env.example .env || touch .env
        shell: bash

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: |
          flutter build apk --release \
            --dart-define=TMDB_READ_ACCESS_TOKEN="$TMDB_READ_ACCESS_TOKEN"

      - name: Prepare Android artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/${APP_NAME}-android-release.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/${{ env.APP_NAME }}-android-release.apk

  web:
    name: Build Web
    needs: tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required configuration
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: |
          if [ -z "$TMDB_READ_ACCESS_TOKEN" ]; then
            echo "Missing secret: TMDB_READ_ACCESS_TOKEN"
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create dummy .env
        run: cp .env.example .env || touch .env
        shell: bash

      - name: Install dependencies
        run: flutter pub get

      - name: Build web release
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: |
          flutter build web --release \
            --dart-define=TMDB_READ_ACCESS_TOKEN="$TMDB_READ_ACCESS_TOKEN"

      - name: Package web artifact
        run: |
          mkdir -p dist
          (cd build/web && zip -r ../../dist/${APP_NAME}-web.zip .)

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-zip
          path: dist/${{ env.APP_NAME }}-web.zip

  linux:
    name: Build Linux zip and deb
    needs: tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            libgtk-3-dev \
            libsecret-1-dev \
            ninja-build \
            pkg-config \
            zip

      - name: Validate required configuration
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: |
          if [ -z "$TMDB_READ_ACCESS_TOKEN" ]; then
            echo "Missing secret: TMDB_READ_ACCESS_TOKEN"
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create dummy .env
        run: cp .env.example .env || touch .env
        shell: bash

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux release
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: |
          flutter build linux --release \
            --dart-define=TMDB_READ_ACCESS_TOKEN="$TMDB_READ_ACCESS_TOKEN"

      - name: Package Linux zip
        run: |
          mkdir -p dist
          (cd build/linux/x64/release/bundle && zip -r ../../../../../dist/${APP_NAME}-linux.zip .)

      - name: Package Linux deb
        run: |
          VERSION="${{ needs.tag.outputs.new_version }}"
          if [ -z "$VERSION" ]; then
            VERSION="0.1.0"
          fi
          rm -rf dist/deb
          mkdir -p dist/deb/DEBIAN
          mkdir -p dist/deb/opt/${APP_NAME}
          mkdir -p dist/deb/usr/share/applications
          cp -r build/linux/x64/release/bundle/* dist/deb/opt/${APP_NAME}/
          {
            printf 'Package: movie-app\n'
            printf 'Version: %s\n' "$VERSION"
            printf 'Section: video\n'
            printf 'Priority: optional\n'
            printf 'Architecture: amd64\n'
            printf 'Maintainer: MovieApp\n'
            printf 'Description: Flutter movie and TV discovery app.\n'
          } > dist/deb/DEBIAN/control
          {
            printf '[Desktop Entry]\n'
            printf 'Type=Application\n'
            printf 'Name=MovieApp\n'
            printf 'Exec=/opt/%s/movie_app\n' "$APP_NAME"
            printf 'Terminal=false\n'
            printf 'Categories=AudioVideo;Video;\n'
          } > dist/deb/usr/share/applications/movie-app.desktop
          dpkg-deb --build dist/deb "dist/${APP_NAME}-linux-amd64.deb"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/${{ env.APP_NAME }}-linux.zip
            dist/${{ env.APP_NAME }}-linux-amd64.deb

  windows:
    name: Build Windows zip
    needs: tag
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required configuration
        shell: pwsh
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TMDB_READ_ACCESS_TOKEN)) {
            Write-Error "Missing secret: TMDB_READ_ACCESS_TOKEN"
            exit 1
          }

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Create dummy .env
        run: cp .env.example .env || touch .env
        shell: bash

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        shell: pwsh
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: |
          flutter build windows --release --dart-define=TMDB_READ_ACCESS_TOKEN="$env:TMDB_READ_ACCESS_TOKEN"

      - name: Package Windows app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\movie-app-windows.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/movie-app-windows.zip

  release:
    name: Publish GitHub Release
    needs:
      - tag
      - android
      - web
      - linux
      - windows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ needs.tag.outputs.new_tag }}
        run: |
          gh release create "$NEW_TAG" dist/* \
            --title "Movie App $NEW_TAG" \
            --generate-notes
