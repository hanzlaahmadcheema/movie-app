name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Analyze, test, and build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create dummy .env
        run: cp .env.example .env || touch .env
        shell: bash

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: |
          if [ -z "$TMDB_READ_ACCESS_TOKEN" ]; then
            echo "TMDB_READ_ACCESS_TOKEN is missing. Using dummy token for CI build."
            TMDB_READ_ACCESS_TOKEN="dummy-token-for-ci"
          fi
          flutter build apk --debug \
            --dart-define=TMDB_READ_ACCESS_TOKEN="$TMDB_READ_ACCESS_TOKEN"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: movie-app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
